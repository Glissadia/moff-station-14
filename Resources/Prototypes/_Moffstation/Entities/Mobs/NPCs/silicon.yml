- type: entity
  parent:
  - MobSiliconBase
  - ShowMedicalIcons
  - StripableInventoryBase
  id: MobRefillableMedibot
  name: refillable medibot
  description: No substitute for a doctor, but better than nothing.
  components:
  - type: RefillableMedibot
    treatments:
      Alive:
        reagent: Tricordrazine
        quantity: 30
      Critical:
        reagent: Inaprovaline
        quantity: 15
  - type: EmaggableRefillableMedibot
    replacements:
      # when you are fine, medibot will help you go sleep
      Alive:
        reagent: Nocturine # Moffstation - Make medibots worth emagging
        quantity: 15
      # when you are crit, medibot will help you have fun
      Critical:
        reagent: SpaceDrugs
        quantity: 25
  - type: Sprite
    sprite: Mobs/Silicon/Bots/refillable-medibot.rsi
    state: refillable-medibot
  - type: HTN
    rootTask:
      task: RefillableMedibotCompound
  - type: Construction
    graph: RefillableMediBot
    node: bot
  - type: Anchorable
  - type: InteractionPopup
    interactSuccessString: petting-success-medibot
    interactFailureString: petting-failure-medibot
    interactSuccessSound:
      path: /Audio/Ambience/Objects/periodic_beep.ogg
  - type: Vocalizer
  - type: DatasetVocalizer
    dataset: RefillableMedibotAds
  - type: Inventory
    templateId: medibot
  - type: DoAfter
  - type: Lock
    locked: true
    unlockOnClick: false
  #- type: ActivatableUIRequiresAccess
  - type: AccessReader
    access: [["Command"], ["Medical"], ["Research"]]
  #- type: SolutionContainerManager
  #  solutions:
  #    tank:
  #      maxVol: 200
  #- type: DumpableSolution
  #  solution: tank
  #- type: RefillableSolution
  #  solution: tank
  - type: ItemSlots
    slots:
      jugSlot:
        whitelist:
          tags:
          - Jug
          - GlassBeaker
  - type: ItemSlotsLock
    slots: ["jugSlot"]
